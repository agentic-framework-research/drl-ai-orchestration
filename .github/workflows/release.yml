name: Release paper

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live (xelatex + bibtex + extras)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra texlive-bibtex-extra texlive-science
      - name: Build PDF
        run: |
          cd paper
          xelatex main.tex
          bibtex main || true
          xelatex main.tex
          xelatex main.tex
      - name: Create GitHub Release (triggers Zenodo DOI)
        uses: softprops/action-gh-release@v2
        with:
          files: paper/main.pdf
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          draft: false
          prerelease: false
